<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Summer Kamp</title>
<meta name="description" content="Juego de fans para armar tu propio Summer Kamp: equipos de influencers, pruebas con minijuegos y una fiesta final con el equipo campeón.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E2F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181140" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Summer Kamp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Lilita One";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/lilita-one-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/baloo-2-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/baloo-2-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/baloo-2-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/baloo-2-latin-800-normal.woff2") format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: app de una columna que se abre a dos columnas en tablet; stickers con borde de tinta y sombra dura; tablero oscuro para los puntajes; minijuegos en una caja central. */
:root{
  --bg:#E2F6F2;
  --sky:#86DBF4;
  --sea:#19AFC2;
  --sun:#FFD23F;
  --card:#FFFFFF;
  --paper:#FFFFFF;
  --ink:#2B1850;
  --muted:#665887;
  --line:#2B1850;
  --shadow:#2B1850;
  --chicle:#E3307F;
  --sol:#FFD23F;
  --turquesa:#14B5AC;
  --coral:#FF7A59;
  --soft:#EFE9FF;
  --on-accent:#FFFFFF;
  --on-bright:#2B1850;
  --board:#2B1850;
  --board-fg:#FFF6E0;
  --board-dim:#B7AADF;
  --ok:#23A55A;
  --bad:#E5484D;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181140;--sky:#2B1F70;--sea:#176C86;--sun:#FFE6A1;--card:#271D5E;--paper:#FFF8EC;--ink:#FFF3E6;--muted:#B8ADE4;--line:#5A49C7;--shadow:#08051F;
    --chicle:#FF5AA2;--sol:#FFD84D;--turquesa:#3CD5CD;--coral:#FF8D70;--soft:#33296F;--on-accent:#2A0B22;--on-bright:#2B1850;
    --board:#0E0A2B;--board-fg:#FFF3E6;--board-dim:#A79BD6;--ok:#4BD07F;--bad:#FF6B6F;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181140;--sky:#2B1F70;--sea:#176C86;--sun:#FFE6A1;--card:#271D5E;--paper:#FFF8EC;--ink:#FFF3E6;--muted:#B8ADE4;--line:#5A49C7;--shadow:#08051F;
  --chicle:#FF5AA2;--sol:#FFD84D;--turquesa:#3CD5CD;--coral:#FF8D70;--soft:#33296F;--on-accent:#2A0B22;--on-bright:#2B1850;
  --board:#0E0A2B;--board-fg:#FFF3E6;--board-dim:#A79BD6;--ok:#4BD07F;--bad:#FF6B6F;color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.2px}
h2{font-size:30px}
h3{font-size:22px}
p{margin:0}
small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
:focus-visible{outline:3px dashed var(--chicle);outline-offset:3px}
ol,ul{margin:0;padding:0;list-style:none}

#app{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 36px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.flow{display:flex;flex-direction:column;gap:18px;width:100%;max-width:880px;margin-inline:auto}
.flow.narrow{max-width:720px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec{display:grid;gap:10px}
.lead{color:var(--muted);font-size:16px}
.note{color:var(--muted);font-size:14px}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.vh{display:grid;gap:4px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand span{font-family:var(--f-display);font-size:21px;line-height:1.1}
.brand small{font-size:13px;font-weight:700}
.icon-btn{width:46px;height:46px;flex:none;border-radius:14px;border:2.5px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--shadow);font-size:21px;display:grid;place-items:center;color:var(--ink);padding:0}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

/* Botones */
.btn{font-family:var(--f-display);font-size:20px;letter-spacing:.3px;border:3px solid var(--line);border-radius:999px;padding:10px 22px;background:var(--card);color:var(--ink);box-shadow:4px 4px 0 var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;transition:transform .08s,box-shadow .08s;text-align:center;line-height:1.1}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn.pri{background:var(--chicle);color:var(--on-accent)}
.btn.sol{background:var(--sol);color:var(--on-bright)}
.btn.turq{background:var(--turquesa);color:var(--on-bright)}
.btn.block{width:100%}
.btn.big{min-height:62px;font-size:23px}
.btn.small{font-size:16px;min-height:42px;padding:6px 16px;border-width:2.5px;box-shadow:3px 3px 0 var(--shadow)}
.btn:disabled{opacity:.45;box-shadow:none}
.linkbtn{border:0;background:transparent;color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:10px;align-self:center;font-size:15px}
.linkbtn:disabled{opacity:.4}
.row-btns{display:flex;flex-wrap:wrap;gap:10px}
.row-btns.center{justify-content:center}

/* Fichas de equipo y avatares */
.temoji{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--tc);border:2.5px solid var(--line);font-size:23px;flex:none;line-height:1}
.temoji.sm{width:32px;height:32px;font-size:17px;border-width:2px}
.av{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--av);color:var(--on-bright);border:2.5px solid var(--line);font-family:var(--f-display);font-size:21px;flex:none;line-height:1}
.av.xs{width:28px;height:28px;font-size:12px;border-width:2px}
.av .av-e{font-size:28px}
.av.xs .av-e{font-size:15px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--ink);line-height:1.6}
.tag.fin{background:var(--chicle);color:var(--on-accent)}
.ptags{display:flex;flex-wrap:wrap;gap:6px}

/* Portada */
.home-grid{display:flex;flex-direction:column;gap:18px}
.home-main,.home-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{position:relative;overflow:hidden;container-type:inline-size;border:3px solid var(--line);border-radius:30px;background:var(--sky);box-shadow:5px 5px 0 var(--shadow);padding:16px 18px 56px;display:grid;gap:12px}
.sun{position:absolute;right:-56px;top:-56px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 36%,transparent 37%),repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--sun) 65%,transparent) 0 9deg,transparent 9deg 22.5deg);animation:spin 50s linear infinite}
.hero-top{display:flex;justify-content:flex-end;position:relative;z-index:2}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:.88;position:relative;z-index:1}
.l-mi{font-size:24px;background:var(--chicle);color:var(--on-accent);padding:3px 14px 1px;border-radius:12px;border:2.5px solid var(--line);transform:rotate(-6deg);box-shadow:3px 3px 0 var(--shadow);margin-bottom:6px}
.l-summer{font-size:clamp(50px,22cqi,120px);color:var(--sol);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:4px 5px 0 var(--shadow);transform:rotate(-3deg);transform-origin:left}
.l-kamp{font-size:clamp(58px,26cqi,140px);color:var(--coral);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:4px 5px 0 var(--shadow);transform:rotate(2deg);margin-left:.3em}
.tagline{position:relative;z-index:1;font-size:18px;font-weight:700;max-width:30ch;color:var(--ink)}
.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:46px}
.wave path{fill:var(--sea)}
.actions{display:grid;gap:12px}
.cont-sub{text-align:center;font-weight:700;color:var(--muted);font-size:14px;margin-top:-4px}
.h-sec{font-size:26px}
.team-strip{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:3px 14px 3px 3px;border-radius:999px;border:2.5px solid var(--line);background:var(--tc);color:var(--on-bright);font-weight:800}
.tchip .temoji{background:var(--paper)}
.steps{display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-size:22px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--sol);color:var(--on-bright);border:2.5px solid var(--line);transform:rotate(-5deg)}
.steps li:nth-child(2)::before{background:var(--turquesa);transform:rotate(4deg)}
.steps li:nth-child(3)::before{background:var(--coral);transform:rotate(-2deg)}
.steps li:nth-child(4)::before{background:var(--chicle);color:var(--on-accent);transform:rotate(5deg)}
.fame{display:grid;gap:8px}
.fame li{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;border:2px solid var(--line);border-radius:18px;background:var(--card)}
.trophy{font-size:24px}
.empty{border:2.5px dashed var(--line);border-radius:20px;padding:18px;text-align:center;color:var(--muted);display:grid;gap:4px;justify-items:center}
.empty span{font-size:30px}
.foot{font-size:13px;color:var(--muted);text-align:center;max-width:60ch;margin-inline:auto;padding-bottom:12px}

/* Pasos de configuración */
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.st{display:flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--line);border-radius:999px;padding:6px 8px;background:var(--card);font-weight:800;font-size:14px;color:var(--ink);opacity:.6}
.st b{font-family:var(--f-display);font-weight:400;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:14px;flex:none}
.st.on{opacity:1;background:var(--sol);color:var(--on-bright);box-shadow:3px 3px 0 var(--shadow)}
.st.on b{background:var(--paper)}
.st.done{opacity:1}
.st.done b{background:var(--turquesa);color:var(--on-bright)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:var(--soft);border:2.5px solid var(--line);border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 8px;font-weight:800;font-size:16px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 0 0 2.5px var(--line)}
.team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:560px){.team-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.team-pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 12px;border:2.5px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);transition:transform .15s}
.team-pick .tp-e{font-size:40px;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 30%,var(--card));border:2.5px solid var(--line);line-height:1}
.team-pick .tp-n{font-family:var(--f-display);font-size:20px}
.team-pick .tp-check{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--paper);color:#2B1850;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;opacity:0}
.team-pick.on{background:var(--tc);color:var(--on-bright);box-shadow:4px 4px 0 var(--shadow);transform:rotate(-1.5deg)}
.team-pick.on:nth-child(even){transform:rotate(1.5deg)}
.team-pick.on .tp-e{background:var(--paper)}
.team-pick.on .tp-check{opacity:1}
.size-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:2.5px solid var(--line);border-radius:20px;background:var(--card)}
.size-row>div:first-child{min-width:0;flex:1 1 200px}
.num-step{display:flex;align-items:center;gap:10px}
.num-step button{width:44px;height:44px;border-radius:14px;border:2.5px solid var(--line);background:var(--sol);color:var(--on-bright);font-family:var(--f-display);font-size:24px;line-height:1}
.num-step button:disabled{opacity:.4}
.num-step output{font-family:var(--f-display);font-size:28px;min-width:30px;text-align:center}
.bbar{position:sticky;bottom:0;z-index:15;display:grid;gap:6px;padding-block:18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 34%)}
.bb-hint{font-size:14px;text-align:center;color:var(--muted);font-weight:700}

/* Participantes */
.tabs{position:relative;display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 8px 5px 5px;font-weight:800;font-size:15px}
.tab .temoji{background:var(--tc)}
.tab .cnt{font-family:var(--f-display);font-weight:400;font-size:14px;background:var(--soft);color:var(--ink);border-radius:999px;padding:0 8px}
.tab .cnt.full{background:var(--turquesa);color:var(--on-bright)}
.tab.on{background:var(--tc);color:var(--on-bright);box-shadow:3px 3px 0 var(--shadow)}
.tab.on .temoji{background:var(--paper)}
.tab.on .cnt{background:var(--paper);color:#2B1850}
.roster{border:3px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--tc) 26%,var(--card));padding:12px 14px;display:grid;gap:10px;box-shadow:4px 4px 0 var(--shadow)}
.roster-h{display:flex;align-items:center;gap:10px}
.roster-h .temoji{background:var(--tc)}
.roster-n{font-family:var(--f-display);font-weight:400;font-size:22px;display:block;line-height:1.1}
.roster-list{display:flex;flex-wrap:wrap;gap:8px}
.rchip{display:inline-flex;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.rchip.cap{background:var(--sol);color:var(--on-bright)}
.rc-main{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-weight:700;font-size:15px;padding:0 6px 0 0;color:inherit}
.rc-x{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:14px;color:inherit;opacity:.75}
.roster-empty{color:var(--ink);font-size:15px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"],.chip.on{background:var(--sol);color:var(--on-bright)}
.chip.emo{font-size:26px;padding:3px 8px;line-height:1.2}
.search{display:flex;align-items:center;gap:8px;border:2.5px solid var(--line);border-radius:16px;background:var(--card);padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:11px 0;outline:none}
.search:focus-within{outline:3px dashed var(--chicle);outline-offset:3px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.ptile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none}
.ptile:active{transform:scale(.97)}
.ptile.in{background:color-mix(in srgb,var(--tc) 34%,var(--card));border-width:3px;padding:11px 5px 9px}
.pname{font-weight:800;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.psub{font-size:11px;color:var(--muted);line-height:1.1;font-weight:600}
.ptile.in .psub{color:var(--ink)}
.psk{font-size:14px;letter-spacing:1px}
.pbadge{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--tc);border:2px solid var(--line);display:grid;place-items:center;font-size:15px}
.pdel{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:12px;color:var(--ink);padding:0}
.ptile.add{border-style:dashed;justify-content:center;background:transparent}
.add-plus{width:56px;height:56px;border-radius:50%;background:var(--sol);display:grid;place-items:center;font-family:var(--f-display);font-size:32px;border:2.5px solid var(--line);color:var(--on-bright)}

/* Pruebas */
.opts{display:grid;gap:12px;padding:14px;border:2.5px solid var(--line);border-radius:20px;background:var(--card)}
.switch{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .sw{width:54px;height:32px;border-radius:999px;border:2.5px solid var(--line);background:var(--soft);position:relative;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);transition:transform .2s}
.switch input:checked + .sw{background:var(--turquesa)}
.switch input:checked + .sw::after{transform:translateX(22px)}
.switch input:focus-visible + .sw{outline:3px dashed var(--chicle);outline-offset:3px}
.pr-list{display:grid;gap:10px}
@media (min-width:760px){.pr-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prc{display:grid;grid-template-columns:58px minmax(0,1fr) 40px;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 12px;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none}
.prc.on{border-width:3px;padding:9px 11px;box-shadow:4px 4px 0 var(--shadow);background:color-mix(in srgb,var(--sol) 26%,var(--card))}
.prc .pe{width:58px;height:58px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:32px;border:2px solid var(--line)}
.prc .pbody{display:grid;gap:3px;min-width:0}
.prc .pbody b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.pdesc{font-size:14px;color:var(--muted);line-height:1.3}
.prc .num{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--card)}
.prc.on .num{background:var(--chicle);color:var(--on-accent)}
.prc.add{border-style:dashed;background:transparent}
.prc.add .pe{background:var(--sol);color:var(--on-bright);font-family:var(--f-display)}
.mini-link{border:0;background:transparent;padding:0;font-size:13px;font-weight:800;text-decoration:underline;color:var(--ink);justify-self:start}
.pts-info{font-size:14px;color:var(--muted);font-weight:700;text-align:center}

/* Hojas (formularios) */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:color-mix(in srgb,var(--shadow) 55%,transparent)}
.sheet-card{position:relative;width:100%;max-width:620px;max-height:90vh;overflow:auto;background:var(--card);border:3px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet-form{display:grid;gap:16px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field{display:grid;gap:6px}
.field>span{font-weight:800}
.field input,.field textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.form-err{color:var(--bad);font-weight:800;min-height:1.2em}

/* Kamp en juego */
.hub-grid,.res-grid{display:flex;flex-direction:column;gap:18px}
.next{background:var(--sol);color:var(--on-bright);border:3px solid var(--line);border-radius:28px;padding:16px;display:grid;gap:12px;box-shadow:5px 5px 0 var(--shadow)}
.next-main{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center}
.next-e{font-size:44px;width:76px;height:76px;border-radius:22px;background:var(--paper);border:2.5px solid var(--line);display:grid;place-items:center;transform:rotate(-5deg)}
.next h2{font-size:28px}
.next p{font-size:15px;margin-top:4px}
.next .tag{background:var(--paper);color:#2B1850}
.board{background:var(--board);color:var(--board-fg);border:3px solid var(--line);border-radius:26px;padding:16px;display:grid;gap:12px;box-shadow:5px 5px 0 var(--shadow)}
.board-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.board small{color:var(--board-dim);font-weight:700}
.blist{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:20px minmax(0,1.4fr) minmax(40px,1fr) 42px;gap:10px;align-items:center}
.bpos{font-family:var(--f-display);color:var(--board-dim);font-size:18px}
.bteam{display:flex;align-items:center;gap:8px;min-width:0}
.bname{font-weight:800;min-width:0;overflow-wrap:anywhere;line-height:1.15}
.crown{font-size:16px}
.btrack{height:14px;border-radius:999px;background:color-mix(in srgb,var(--board-fg) 14%,transparent);overflow:hidden}
.btrack i{display:block;height:100%;background:var(--tc);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bpts{font-family:var(--f-display);font-size:24px;text-align:right;font-variant-numeric:tabular-nums}
.timeline{display:grid;gap:6px}
.timeline li{display:grid;grid-template-columns:24px 30px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 12px;border-radius:16px;border:2px solid transparent}
.tl-n{font-family:var(--f-display);color:var(--muted)}
.tl-e{font-size:20px;text-align:center}
.tl-name{font-weight:700;min-width:0}
.tl-res{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.timeline li.now{background:var(--card);border-color:var(--line)}
.timeline li.now .tl-name{font-weight:800}
.now-pill{background:var(--chicle);color:var(--on-accent);padding:1px 10px;border-radius:999px}
.timeline li.todo .tl-name{color:var(--muted)}
.teams-det{border:2.5px solid var(--line);border-radius:20px;background:var(--card);padding:10px 14px}
.teams-det summary{font-family:var(--f-display);font-size:20px;cursor:pointer;padding-block:4px}
.tt-list{display:grid;gap:12px;padding-top:10px}
.tteam{display:grid;gap:6px}
.tt-h{display:flex;align-items:center;gap:8px}
.tt-m{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 2px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px}
.confirm{border:2.5px solid var(--line);border-radius:20px;padding:14px;background:var(--card);display:grid;gap:12px;text-align:center}

/* Prueba */
.pr-hero{text-align:center;display:grid;justify-items:center;gap:8px;padding:20px 16px;border:3px solid var(--line);border-radius:28px;background:var(--card);box-shadow:5px 5px 0 var(--shadow)}
.pr-hero p{max-width:46ch}
.pr-hero-e{font-size:68px;line-height:1;animation:bob 2.6s ease-in-out infinite}
.pr-hero-e.sm{font-size:48px}
.pr-hero.compact{padding:14px}
.bonus-list{display:grid;gap:8px}
.bonus-list li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;font-weight:700}
.bn{font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.bn.on{background:var(--turquesa);color:var(--on-bright)}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:2.5px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);padding:12px 14px;box-shadow:4px 4px 0 var(--shadow)}
.mode-e{font-size:30px;width:56px;height:56px;border-radius:16px;background:var(--soft);display:grid;place-items:center}
.mode b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block}
.mode:disabled{opacity:.5;box-shadow:none}
.mode:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.handoff,.score-card{background:var(--tc);color:var(--on-bright);border:3px solid var(--line);border-radius:30px;padding:22px 16px;text-align:center;display:grid;justify-items:center;gap:8px;box-shadow:5px 5px 0 var(--shadow)}
.handoff h2{font-size:34px}
.handoff small,.score-card small{color:var(--on-bright)}
.ho-e{font-size:68px;line-height:1;width:116px;height:116px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;animation:bob 2.2s ease-in-out infinite}
.ho-e.sm{font-size:44px;width:80px;height:80px}
.ho-tip{font-weight:700}
.howto{border:2.5px dashed var(--line);border-radius:22px;padding:14px 16px;display:grid;gap:6px}
.bonus-line{font-weight:700;color:var(--muted)}
.big-score{font-family:var(--f-display);font-size:96px;line-height:1;color:var(--paper);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:4px 4px 0 var(--shadow)}
.calc{font-weight:700}
.mini-rank{display:grid;gap:8px}
.mini-rank li{display:grid;grid-template-columns:34px 32px minmax(0,1fr) auto;gap:10px;align-items:center;font-weight:700}
.mr-pos{font-family:var(--f-display);font-size:20px;text-align:center}
.mr-s{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.play-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:18px}
.play-pr{margin-left:auto;color:var(--muted);font-size:15px}

/* Minijuegos */
.mg{position:relative;background:var(--card);border:3px solid var(--line);border-radius:28px;box-shadow:5px 5px 0 var(--shadow);padding:16px;min-height:max(440px,58vh);display:flex;flex-direction:column;gap:16px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.mg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-size:22px}
.mg-head b{font-weight:400;font-variant-numeric:tabular-nums}
.mg-legend{font-family:var(--f-body);font-weight:800;font-size:15px;color:var(--muted)}
.countdown{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 82%,transparent);font-family:var(--f-display);font-size:120px;color:var(--chicle);-webkit-text-stroke:4px var(--line);paint-order:stroke fill;z-index:5}
.countdown.bump{animation:bump .5s ease-out}
.track{position:relative;height:72px;border-radius:999px;border:3px solid var(--line);background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--sea) 85%,var(--paper)) 0 26px,var(--sea) 26px 52px)}
.runner{position:absolute;top:50%;left:calc(6px + var(--p,0) * (100% - 66px));transform:translateY(-50%);font-size:40px;line-height:1;transition:left .08s linear}
.finish{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:30px}
.tap-wrap{flex:1;display:grid;place-items:center;padding-block:10px}
.tap-btn{width:min(230px,60vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--tc);color:var(--on-bright);border:4px solid var(--line);box-shadow:6px 6px 0 var(--shadow);font-family:var(--f-display);font-size:34px}
.tap-btn:disabled{opacity:.6}
.tap-btn.pop{animation:pop .12s ease-out}
.rx{flex:1;min-height:300px;border-radius:24px;border:3px solid var(--line);display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;font-family:var(--f-display);font-size:30px;background:var(--soft);color:var(--ink);width:100%}
.rx-e{font-size:72px;line-height:1}
.rx.go{background:var(--sol);color:var(--on-bright)}
.rx.ok{background:var(--turquesa);color:var(--on-bright)}
.rx.bad{background:var(--bad);color:var(--on-bright);animation:shake .3s}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dots i.on{background:var(--d)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:1;align-content:center}
.mcard{aspect-ratio:1/1.1;border-radius:16px;border:2.5px solid var(--line);background:var(--chicle);font-size:clamp(28px,7vw,52px);display:grid;place-items:center;padding:0;background-image:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--paper) 45%,transparent) 0 12%,transparent 13%)}
.mcard span{opacity:0;transition:opacity .12s;line-height:1}
.mcard.up{background:var(--paper);background-image:none;animation:flip .22s ease-out}
.mcard.up span{opacity:1}
.mcard.ok{background:color-mix(in srgb,var(--turquesa) 45%,var(--paper));border-color:var(--line)}
.pt-track{position:relative;height:100px;border-radius:999px;border:3px solid var(--line);background:linear-gradient(90deg,var(--soft) 0 30%,color-mix(in srgb,var(--sol) 45%,var(--soft)) 30% 42%,var(--sol) 42% 58%,color-mix(in srgb,var(--sol) 45%,var(--soft)) 58% 70%,var(--soft) 70%)}
.pt-track::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:4px;margin-left:-2px;border-radius:2px;background:var(--line)}
.pt-center{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:26px}
.pt-mark{position:absolute;top:50%;left:calc(30px + var(--p,.5) * (100% - 60px));transform:translate(-50%,-50%);font-size:46px;line-height:1;z-index:1}
.pt-mark.hit{animation:pop .3s ease-out}
.mg-last{font-family:var(--f-display)}
.arena{position:relative;flex:1;min-height:340px;border-radius:24px;border:3px solid var(--line);background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--paper) 25%,transparent) 0 8%,transparent 9%),radial-gradient(circle at 75% 65%,color-mix(in srgb,var(--paper) 18%,transparent) 0 6%,transparent 7%),var(--sea);overflow:hidden}
.item{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border:0;background:transparent;font-size:46px;line-height:1;padding:0;animation:itemIn .15s ease-out,itemOut var(--life) linear forwards}
.fx{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:28px;pointer-events:none;animation:floatUp .6s ease-out forwards;-webkit-text-stroke:2px var(--line);paint-order:stroke fill}
.fx.good{color:var(--sol)}
.fx.bad{color:var(--bad)}
.arena-end{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:48px;color:var(--paper);-webkit-text-stroke:3px var(--line);paint-order:stroke fill}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;align-content:center;max-width:460px;width:100%;margin-inline:auto}
.pad{aspect-ratio:1;border-radius:28px;border:3px solid var(--line);background:var(--pc);font-size:clamp(40px,10vw,64px);opacity:.5;transition:opacity .1s,transform .1s;padding:0}
.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 0 6px var(--paper),0 0 0 9px var(--line)}
.pad.wrong{animation:shake .3s}

/* Simulación y jueza */
.sim-h{display:flex;align-items:center;gap:14px}
.sim-e{font-size:52px;line-height:1}
.lanes{display:grid;gap:12px}
.lane{position:relative;height:60px;border-radius:999px;border:2.5px solid var(--line);background:color-mix(in srgb,var(--tc) 28%,var(--card));overflow:hidden}
.lname{position:absolute;left:66px;top:50%;transform:translateY(-50%);font-weight:800;font-size:15px;opacity:.85}
.goal{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:24px}
.run{position:absolute;top:50%;left:calc(28px + var(--p,0) * (100% - 76px));transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--tc);border:2.5px solid var(--line);display:grid;place-items:center;font-size:25px;z-index:1}
.ticker{min-height:56px;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:21px;padding:10px 14px;border-radius:18px;background:var(--board);color:var(--board-fg)}
.judge{display:grid;gap:12px}
.jbtn{display:grid;grid-template-columns:44px minmax(0,1fr) 52px;align-items:center;gap:12px;padding:10px 14px;border:2.5px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);text-align:left;box-shadow:4px 4px 0 var(--shadow);font-size:18px}
.jbtn.set{background:var(--tc);color:var(--on-bright);box-shadow:none}
.jbtn.set .temoji{background:var(--paper)}
.jpos{font-size:30px;text-align:center;font-family:var(--f-display)}

/* Resultados */
.res-h{display:grid;gap:4px}
.res-list{display:grid;gap:10px}
.res-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:20px;background:var(--card);border:2px solid var(--line)}
.res-row.first{background:color-mix(in srgb,var(--tc) 40%,var(--card));border-width:3px;box-shadow:4px 4px 0 var(--shadow)}
.medal{font-size:30px;text-align:center;font-family:var(--f-display)}
.res-team{display:flex;align-items:center;gap:10px;min-width:0}
.res-t{min-width:0}
.res-t b{font-size:17px}
.res-row.first small{color:var(--ink)}
.pts-chip{font-family:var(--f-display);font-size:21px;background:var(--sol);color:var(--on-bright);border:2.5px solid var(--line);border-radius:14px;padding:2px 10px;font-variant-numeric:tabular-nums}
.star-card{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:2.5px solid var(--line);border-radius:22px;background:var(--card)}
.star-e{font-size:36px;text-align:center;animation:bob 2s ease-in-out infinite}
.sc-t b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.sc-t span{font-size:14px;font-weight:700}
.reto{background:var(--chicle);color:var(--on-accent);border:3px solid var(--line);border-radius:24px;padding:14px 16px;display:grid;gap:6px;transform:rotate(-1deg);box-shadow:4px 4px 0 var(--shadow)}
.reto p{font-family:var(--f-display);font-size:21px;line-height:1.2}

/* Fiesta final */
.party,.drum{text-align:center;display:grid;justify-items:center;gap:10px;padding:22px 16px;border:3px solid var(--line);border-radius:30px;background:var(--board);color:var(--board-fg);box-shadow:5px 5px 0 var(--shadow)}
.party h2,.drum h2{font-size:32px}
.drum-e{font-size:64px;animation:shake .5s ease-in-out infinite}
.finalists{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.finalist{display:grid;justify-items:center;gap:6px;font-weight:800}
.finalist .temoji{width:72px;height:72px;font-size:38px;border-width:3px}
.champ{position:relative;overflow:hidden;background:var(--tc);color:var(--on-bright);border:3px solid var(--line);border-radius:32px;padding:26px 16px;text-align:center;display:grid;justify-items:center;gap:10px;box-shadow:6px 6px 0 var(--shadow)}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--paper) 35%,transparent) 0 9deg,transparent 9deg 22.5deg);animation:spin 36s linear infinite;z-index:0}
.champ>*:not(.rays){position:relative;z-index:1}
.champ-e{font-size:84px;width:136px;height:136px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;line-height:1}
.champ-n{font-size:clamp(42px,11vw,72px);color:var(--paper);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:4px 4px 0 var(--shadow)}
.champ-p{font-weight:800;font-size:18px}
.champ-team{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tie{font-weight:700;font-size:14px}
.awards{display:grid;gap:10px}
@media (min-width:640px){.awards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.award{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border:2.5px solid var(--line);border-radius:22px;background:var(--card)}
.award .ae{font-size:32px;width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center}
.award b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.aw-why{font-size:13px;color:var(--muted);font-weight:600;display:block;line-height:1.3}
.final-actions{display:grid;gap:12px}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--board);color:var(--board-fg);border:2.5px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:700;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (min-width:860px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
  .home-main{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
  .hub-grid,.res-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1.5);opacity:.3}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes flip{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes itemIn{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes itemOut{0%,60%{opacity:1}100%{opacity:0;transform:scale(.5)}}
@keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-40px}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .item{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confeti" hidden aria-hidden="true"></canvas>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));

const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a&&a.length?a[Math.floor(Math.random()*a.length)]:undefined;
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const hash=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.codePointAt(0))>>>0;return h;};
const initials=n=>{const w=String(n).replace(/[^\p{L}\p{N}\s]/gu,'').trim().split(/\s+/).filter(Boolean);if(!w.length)return '?';if(w.length===1)return w[0].slice(0,2).toUpperCase();return (w[0][0]+w[1][0]).toUpperCase();};

function standingsFull(g){
  const m={};g.teams.forEach(t=>{m[t.id]=Object.assign({},t,{pts:0,wins:0,seconds:0});});
  g.results.forEach(r=>r.rows.forEach(row=>{const x=m[row.teamId];if(!x)return;x.pts+=row.pts;if(row.place===0)x.wins++;if(row.place===1)x.seconds++;}));
  return Object.values(m).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||b.seconds-a.seconds||a.n.localeCompare(b.n,'es'));
}

let AC=null;
function ac(){if(!S.sound)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,d,type,v,delay){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;const t=a.currentTime+(delay||0);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.07,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
const sfx={
  tap:()=>tone(660,.06,'triangle',.05),
  good:()=>{tone(784,.1,'triangle',.07);tone(1046,.16,'triangle',.07,.08);},
  bad:()=>tone(190,.22,'square',.035),
  tick:()=>tone(520,.09,'sine',.07),
  go:()=>tone(880,.28,'triangle',.08),
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.28,'triangle',.08,i*.12)),
  pad:i=>tone([392,494,587,698][i],.3,'sine',.08)
};

/* ---------- confeti ---------- */
let confId=0;
function confetti(colors,count){
  if(reduceMotion)return;
  const cv=$('#confeti');const ctx=cv.getContext('2d');if(!ctx)return;
  const id=++confId;const dpr=Math.min(2,window.devicePixelRatio||1);const W=window.innerWidth,H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cv.hidden=false;
  const cols=(colors||[]).concat(['#FFD23F','#E3307F','#14B5AC','#FF7A59','#4C95FF']);
  const parts=Array.from({length:count||140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:rnd(-1.4,1.4),vy:rnd(2.2,5.2),r:rnd(6,11),a:Math.random()*6.28,va:rnd(-.2,.2),c:pick(cols),s:Math.random()<.6}));
  const t0=performance.now();
  function step(t){
    if(id!==confId)return;
    const el=t-t0;ctx.clearRect(0,0,W,H);
    for(const p of parts){p.x+=p.vx+Math.sin(el/380+p.r)*.7;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;if(p.s){ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);}else{ctx.beginPath();ctx.arc(0,0,p.r/2.4,0,6.283);ctx.fill();}ctx.restore();}
    if(el<4300)requestAnimationFrame(step);else{ctx.clearRect(0,0,W,H);cv.hidden=true;}
  }
  requestAnimationFrame(step);
}

function ensureActive(){const d=S.draft;if(!d.teamIds.includes(S.ui.activeTeam))S.ui.activeTeam=d.teamIds[0]||null;}
function tabsHTML(){
  const d=S.draft;
  return d.teamIds.map(id=>{const t=teamDef(id);const n=(d.roster[id]||[]).length;const on=id===S.ui.activeTeam;return `<button class="tab ${on?'on':''}" style="--tc:${t.c}" data-act="tab" data-id="${id}" aria-pressed="${on}"><span class="temoji sm">${t.e}</span>${esc(t.n)}<span class="cnt ${n>=d.size?'full':''}">${n}/${d.size}</span></button>`;}).join('');
}
function rosterHTML(){
  const d=S.draft;const id=S.ui.activeTeam;const t=teamDef(id);if(!t)return '';
  const r=(d.roster[id]||[]).filter(pid=>person(pid));const cap=d.captain[id];
  return `<div class="roster" style="--tc:${t.c}"><div class="roster-h"><span class="temoji">${t.e}</span><div><b class="roster-n">${esc(t.n)}</b><small>${r.length} de ${d.size}${r.length>1?' · toca un nombre para elegir líder 👑':''}</small></div></div>${r.length?`<div class="roster-list">${r.map(pid=>{const p=person(pid);return `<span class="rchip ${pid===cap?'cap':''}"><button class="rc-main" data-act="captain" data-id="${pid}" aria-label="Elegir a ${esc(p.n)} como líder">${avatar(p,'xs')}${esc(p.n)}${pid===cap?' 👑':''}</button><button class="rc-x" data-act="remove" data-id="${pid}" aria-label="Quitar a ${esc(p.n)}">✕</button></span>`;}).join('')}</div>`:`<p class="roster-empty">Toca participantes abajo para sumarlos a ${esc(t.n)}.</p>`}</div>`;
}
function filtersHTML(){return FILTERS.map(f=>`<button class="chip" data-act="filter" data-f="${f[0]}" aria-pressed="${S.ui.filter===f[0]}">${f[1]}</button>`).join('');}
function gridHTML(){
  const f=S.ui.filter,q=norm(S.ui.search.trim());
  const list=allPeople().filter(p=>(f==='all'||p.ed.includes(f))&&(!q||norm(p.n+' '+(p.sub||'')).includes(q)));
  const add=(f==='all'||f==='mine')&&!q?`<div class="ptile add" role="button" tabindex="0" data-act="addPlayer"><span class="add-plus" aria-hidden="true">+</span><span class="pname">Agregar participante</span><span class="psub">Tú o tus amigas</span></div>`:'';
  const tiles=list.map(p=>{
    const tid=teamOf(p.id);const t=tid&&teamDef(tid);
    return `<div class="ptile ${t?'in':''}" role="button" tabindex="0" data-act="pick" data-id="${p.id}" ${t?`style="--tc:${t.c}"`:''} aria-pressed="${!!t}" aria-label="${esc(p.n)}${t?`, en ${esc(t.n)}`:''}">${t?`<span class="pbadge" aria-hidden="true">${t.e}</span>`:''}${p.ed.includes('mine')?`<button class="pdel" data-act="delPlayer" data-id="${p.id}" aria-label="Borrar a ${esc(p.n)}">✕</button>`:''}${avatar(p)}<span class="pname">${esc(p.n)}</span>${p.sub?`<span class="psub">${esc(p.sub)}</span>`:''}<span class="psk" aria-label="Superpoderes: ${p.sk.map(s=>SK[s].n).join(' y ')}">${p.sk.map(s=>SK[s].e).join('')}${p.co?' '+FLAG[p.co]:''}</span></div>`;
  }).join('');
  if(!list.length&&!add)return `<div class="empty" style="grid-column:1/-1"><p>No hay participantes con ese nombre.</p></div>`;
  return add+tiles;
}
function playersOk(){const d=S.draft;return d.teamIds.length>=2&&d.teamIds.every(t=>(d.roster[t]||[]).length>0);}
function playersBB(){const ok=playersOk();return `${ok?'':'<p class="bb-hint">Cada equipo necesita al menos 1 participante.</p>'}<button class="btn pri block big" data-act="nav" data-to="setup-pruebas" ${ok?'':'disabled'}>Siguiente: pruebas</button>`;}

V.hub=()=>{
  const g=S.game;const len=g.pruebas.length;const done=g.idx>=len;const pr=done?null:g.pruebas[g.idx];const fin=!done&&isFinal(g,g.idx);
  const next=done

    :`<section class="next"><span class="eyebrow">${fin?'Gran final · puntos dobles':`Prueba ${g.idx+1} de ${len}`}</span><div class="next-main"><span class="next-e" aria-hidden="true">${pr.e}</span><div><h2>${esc(pr.n)}</h2><p>${esc(pr.d)}</p></div></div><div class="ptags">${skTags(pr)}${gameTag(pr)}</div><button class="btn pri block big" data-act="openPrueba">¡A jugar!</button></section>`;
  const tl=`<section class="sec"><h3>Pruebas del Kamp</h3><ol class="timeline">${g.pruebas.map((p,i)=>{
    const r=g.results[i];const cls=r?'done':i===g.idx?'now':'todo';let right='';
    if(r){const w=team(r.rows[0].teamId);right=`<span class="tl-res">Ganó ${w.e} ${esc(w.n)}</span>`;}
    else if(i===g.idx)right='<span class="tl-res now-pill">Ahora</span>';
    else if(isFinal(g,i))right='<span class="tl-res">×2</span>';
    return `<li class="${cls}"><span class="tl-n">${i+1}</span><span class="tl-e" aria-hidden="true">${r?'✅':p.e}</span><span class="tl-name">${esc(p.n)}</span>${right}</li>`;
  }).join('')}</ol></section>`;
  const teams=`<details class="teams-det"><summary>Ver los equipos</summary><div class="tt-list">${g.teams.map(t=>`<div class="tteam"><div class="tt-h"><span class="temoji sm" style="--tc:${t.c}">${t.e}</span><b>${esc(t.n)}</b></div><div class="tt-m">${t.members.map(pid=>{const p=person(pid);return p?`<span class="mchip">${avatar(p,'xs')}${esc(p.n)}${pid===t.captain?' 👑':''}</span>`:'';}).join('')}</div></div>`).join('')}</div></details>`;
  const end=S.ui.confirmEnd
    ?`<div class="confirm"><p><b>¿Terminar el Kamp ahora?</b><br>Solo cuentan las pruebas que ya jugaron.</p><div class="row-btns center"><button class="btn small pri" data-act="confirmEnd">Sí, ir a la fiesta final</button><button class="btn small" data-act="cancelEnd">Seguir jugando</button></div></div>`
    :(g.results.length&&!done?`<button class="linkbtn" data-act="askEnd">Terminar el Kamp ahora</button>`:'');
  return `${top('Kamp en juego')}<div class="hub-grid"><div class="col">${next}${tl}</div><div class="col">${boardHTML(g)}${teams}${end}</div></div>`;
};

/* ---------- lógica del juego ---------- */
function autoFill(d){
  const pool=shuffle(allPeople().map(p=>p.id));
  const used=new Set();d.teamIds.forEach(t=>(d.roster[t]||[]).forEach(pid=>used.add(pid)));
  if(d.mode==='paises'){
    d.teamIds.forEach(tid=>{const r=d.roster[tid]||(d.roster[tid]=[]);pool.forEach(pid=>{const p=person(pid);if(r.length<d.size&&!used.has(pid)&&p&&p.co===tid){r.push(pid);used.add(pid);}});});
  }
  let added=0;
  d.teamIds.forEach(tid=>{const r=d.roster[tid]||(d.roster[tid]=[]);for(const pid of pool){if(r.length>=d.size)break;if(!used.has(pid)){r.push(pid);used.add(pid);added++;}}});
  d.teamIds.forEach(tid=>{const r=d.roster[tid];if(!r.includes(d.captain[tid]))d.captain[tid]=r[0]||null;});
  return added;
}
function removeFrom(tid,pid){const d=S.draft;d.roster[tid]=(d.roster[tid]||[]).filter(x=>x!==pid);if(d.captain[tid]===pid)d.captain[tid]=d.roster[tid][0]||null;}

function startGame(){
  const d=S.draft;
  const teams=d.teamIds.map(id=>{const t=teamDef(id);const members=(d.roster[id]||[]).filter(pid=>person(pid));return {id,n:t.n,e:t.e,c:t.c,members,captain:members.includes(d.captain[id])?d.captain[id]:members[0]};});
  const people={};
  teams.forEach(t=>t.members.forEach(pid=>{const p=person(pid);if(p)people[pid]={id:pid,n:p.n,sub:p.sub,av:p.av,sk:p.sk.slice()};}));
  const all=allPruebas();
  const pruebas=d.pruebas.map(id=>all.find(p=>p.id===id)).filter(Boolean).map(p=>Object.assign({},p));
  S.game={teams,people,pruebas,idx:0,results:[],doubleFinal:d.doubleFinal,retos:d.retos,mode:d.mode,revealed:0,saved:false,awards:null,started:Date.now()};
  PS=null;S.ui.confirmEnd=false;S.view='hub';go();
}
function quickGame(){
  const d=defaultDraft();
  d.teamIds=shuffle(TEAMS_A).slice(0,4).map(t=>t.id);
  autoFill(d);
  d.pruebas=shuffle(PR.filter(p=>p.g!=='jueza')).slice(0,5).map(p=>p.id);
  S.draft=d;startGame();toast('¡Listo! Equipos y pruebas sorteados.');
}
function simScores(g,pr){
  return g.teams.map(t=>{
    const ms=t.members.map(pid=>{const p=person(pid);const m=p&&p.sk.some(s=>pr.sk.includes(s));return rnd(35,90)+(m?18:0);});
    const avg=ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:40;
    return {teamId:t.id,score:Math.round(clamp(avg+rnd(-6,6),1,100))};
  });
}
function pickMVP(g,pr,winner){
  const c=[];
  g.teams.forEach(t=>t.members.forEach(pid=>{const p=person(pid);if(!p)return;let w=t.id===winner?3:1;if(p.sk.some(s=>pr.sk.includes(s)))w+=2;c.push({pid,teamId:t.id,w});}));
  if(!c.length)return null;
  let r=Math.random()*c.reduce((a,x)=>a+x.w,0);
  for(const x of c){r-=x.w;if(r<=0)return {pid:x.pid,teamId:x.teamId};}
  const l=c[c.length-1];return {pid:l.pid,teamId:l.teamId};
}
function finishPrueba(mode,scored){
  const g=S.game;const fin=isFinal(g,g.idx);const pr=g.pruebas[g.idx];
  const rows=scored.map((s,i)=>({teamId:s.teamId,raw:s.raw==null?null:s.raw,bonus:s.bonus||0,score:s.score==null?null:s.score,place:i,pts:(PTS[i]||1)*(fin?2:1)}));
  const mvp=pickMVP(g,pr,rows[0].teamId);
  const reto=g.retos&&rows.length>1?{teamId:rows[rows.length-1].teamId,text:pick(RETOS)}:null;
  g.results.push({prId:pr.id,mode,rows,mvp,reto,fin});
  g.idx++;PS=null;S.view='results';go();
  sfx.win();const w=team(rows[0].teamId);confetti([w.c,w.c],90);
}
function computeAwards(g,st){
  const all=[];g.teams.forEach(t=>t.members.forEach(pid=>all.push({pid,teamId:t.id})));
  if(!all.length)return [];
  const cnt={};g.results.forEach(r=>{if(r.mvp)cnt[r.mvp.pid]=(cnt[r.mvp.pid]||0)+1;});
  const used=new Set();const out=[];
  const ids=Object.keys(cnt);
  if(ids.length){
    const m=Math.max(...ids.map(i=>cnt[i]));const sid=pick(ids.filter(i=>cnt[i]===m));const s=all.find(a=>a.pid===sid);
    out.push({k:'star',e:'⭐',t:'Estrella del Kamp',why:`Fue la estrella en ${m} ${plural(m,'prueba','pruebas')}.`,pid:sid,teamId:s?s.teamId:null});used.add(sid);
  }
  const free=()=>all.filter(a=>!used.has(a.pid));
  const brave=free().filter(a=>{const p=person(a.pid);return p&&p.sk.includes('valentia');});
  const b=pick(brave.length?brave:free());
  if(b){out.push({k:'boom',e:'🔥',t:'El más explosivo',why:'Por darlo todo en cada prueba.',pid:b.pid,teamId:b.teamId});used.add(b.pid);}
  const lastT=st[st.length-1];const heart=free().filter(a=>a.teamId===lastT.id);const h=pick(heart.length?heart:free());
  if(h)out.push({k:'heart',e:'💖',t:'Corazón del Kamp',why:'Por animar a su equipo hasta el final.',pid:h.pid,teamId:h.teamId});
  return out;
}

/* ---------- simulación ---------- */
function simMsg(ps,pr){
  const ids=Object.keys(ps).sort((a,b)=>ps[b]-ps[a]);
  const tn=id=>{const t=team(id);return `${t.e} ${t.n}`;};
  const lead=ids[0],second=ids[1]||ids[0],last=ids[ids.length-1],r=pick(ids);
  const sk=SK[pick(pr.sk)];const b=teamBonus(team(r),pr);
  return pick([
    `¡El equipo ${tn(lead)} va adelante!`,
    `El equipo ${tn(last)} no se rinde. ¡Vamos!`,
    b.count?`¡El equipo ${tn(r)} usa su superpoder ${sk.e}!`:`El equipo ${tn(r)} se coordina perfecto.`,
    `¡Qué emoción! ${tn(second)} persigue a ${tn(lead)}.`,
    `El equipo ${tn(r)} se tropieza… ¡pero se levanta!`,
    `¡La barra grita por ${tn(r)}!`
  ]);
}
function runSim(){
  const arr=PS.sim;const tk=$('#ticker');
  arr.forEach(x=>{x.T=3600+x.rank*520+rnd(0,160);x.ph=Math.random()*6;});
  const maxT=Math.max(...arr.map(x=>x.T));
  const runs={};arr.forEach(x=>{runs[x.teamId]=$('#run-'+x.teamId);});
  const finish=()=>{arr.forEach(x=>runs[x.teamId]&&runs[x.teamId].style.setProperty('--p',1));const w=team(arr.find(x=>x.rank===0).teamId);tk.textContent=`¡El equipo ${w.e} ${w.n} llegó primero!`;$('#simBtn').hidden=false;$('#simSkip').hidden=true;};
  if(reduceMotion){finish();return;}
  const t0=performance.now();let lastMsg=-2000;let first=false;
  loop(now=>{
    if(PS.skip){finish();return false;}
    const t=now-t0;const ps={};
    arr.forEach(x=>{const u=Math.min(1,t/x.T);let p=u+0.06*Math.sin(t/260+x.ph)*(1-u)*Math.min(1,u*4);p=clamp(p,0,1);ps[x.teamId]=p;runs[x.teamId].style.setProperty('--p',p);if(u>=1&&x.rank===0&&!first){first=true;sfx.good();}});
    if(!first&&t-lastMsg>1100){lastMsg=t;tk.textContent=simMsg(ps,S.game.pruebas[S.game.idx]);}
    if(first&&t<maxT){const w=team(arr.find(x=>x.rank===0).teamId);tk.textContent=`¡El equipo ${w.e} ${w.n} cruza la meta!`;}
    if(t>maxT+350){finish();return false;}
  });
}

    const d=Math.abs(pos-.5)*2;const sc=Math.max(0,Math.round(100-d*160));scores.push(sc);
    L.textContent=sc>=85?`¡Perfecto! ${sc}`:sc>=50?`¡Bien! ${sc}`:`Uy… ${sc}`;(sc>=70?sfx.good:sc>=35?sfx.tap:sfx.bad)();
    K.classList.remove('hit');void K.offsetWidth;K.classList.add('hit');k++;
    later(()=>{if(k>=3){done(Math.round(scores.reduce((a,b)=>a+b,0)/3));}else{N.textContent=k+1;run();}},1100);
  };
  B.addEventListener('pointerdown',hit);kbClick(B,hit);
  return {start:run};
};

MG.atrapa=(box,pr,t,done)=>{
  const items=pr.items||{good:'⭐',bad:'🦀'};const DUR=15000;let net=0,on=false;
  box.innerHTML=`<div class="mg-head"><span><b id="mgT">15</b> s</span><span class="mg-legend">${items.good} +1 · ${items.bad} −2</span><span><b id="mgC">0</b> pts</span></div><div class="arena" id="mgA"></div>`;
  const A=$('#mgA',box),T=$('#mgT',box),C=$('#mgC',box);
  function fx(el,txt,cls){const f=document.createElement('span');f.className='fx '+cls;f.textContent=txt;f.style.left=el.style.left;f.style.top=el.style.top;A.appendChild(f);later(()=>f.remove(),650);}
  function spawn(prog){
    const bad=Math.random()<.27;const el=document.createElement('button');
    el.className='item';el.textContent=bad?items.bad:items.good;el.style.left=rnd(10,90)+'%';el.style.top=rnd(12,88)+'%';
    const life=Math.round(1300-prog*420);el.style.setProperty('--life',life+'ms');el.setAttribute('aria-label',bad?'No tocar':'Atrapar');
    el.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!on||el.dataset.hit)return;el.dataset.hit='1';if(bad){net-=2;sfx.bad();fx(el,'−2','bad');}else{net+=1;sfx.tap();fx(el,'+1','good');}C.textContent=net;el.remove();});
    A.appendChild(el);later(()=>el.remove(),life);
  }
  return {start(){
    on=true;const t0=performance.now();let nextAt=t0;
    loop(now=>{
      const el=now-t0;const left=Math.max(0,DUR-el);T.textContent=Math.ceil(left/1000);
      if(left<=0){on=false;A.innerHTML='<div class="arena-end">¡Tiempo!</div>';later(()=>done(clamp(Math.round(net/22*100),0,100)),1000);return false;}
      if(now>=nextAt){const prog=el/DUR;spawn(prog);if(Math.random()<.25)spawn(prog);nextAt=now+(580-prog*200);}
    });
  }};
};

MG.secuencia=(box,pr,t,done)=>{
  const icons=pr.pads||['🌺','🐚','⭐','🌴'];const cols=['var(--chicle)','var(--sol)','var(--turquesa)','var(--coral)'];
  let seq=[],k=0,best=0,input=false,ended=false;
  box.innerHTML=`<div class="mg-head"><span>Pasos <b id="mgN">3</b></span><span class="mg-legend" id="mgS">Miren con atención…</span></div><div class="pads">${icons.map((ic,i)=>`<button class="pad" data-i="${i}" style="--pc:${cols[i]}" aria-label="Botón ${i+1}">${ic}</button>`).join('')}</div>`;
  const pads=$$('.pad',box),N=$('#mgN',box),St=$('#mgS',box);
  function flash(i,ms){pads[i].classList.add('lit');sfx.pad(i);later(()=>pads[i].classList.remove('lit'),ms);}
  function play(){
    input=false;St.textContent='Miren con atención…';N.textContent=seq.length;let j=0;
    const iv=Math.max(380,620-seq.length*22);
    const step=()=>{if(j<seq.length){flash(seq[j],Math.round(iv*.65));j++;later(step,iv);}else{input=true;k=0;St.textContent='¡Su turno!';}};
    later(step,550);
  }
  function end(){ended=true;input=false;const sc=best===0?5:Math.round(Math.min(100,(best-2)/8*100));St.textContent=best?`Llegaron a ${best} pasos`:'¡Casi!';later(()=>done(sc),1100);}
  pads.forEach((p,i)=>{
    const hit=e=>{
      if(e)e.preventDefault();if(!input||ended)return;flash(i,200);
      if(seq[k]!==i){sfx.bad();p.classList.add('wrong');end();return;}
      k++;
      if(k===seq.length){best=seq.length;input=false;if(best>=10){St.textContent='¡Perfecto!';sfx.good();end();return;}St.textContent='¡Bien!';later(()=>{seq.push(Math.floor(Math.random()*4));play();},700);}
    };
    p.addEventListener('pointerdown',hit);kbClick(p,hit);
  });
  return {start(){seq=[0,0,0].map(()=>Math.floor(Math.random()*4));play();}};
};

function startPlay(){
  const g=S.game;const pr=g.pruebas[g.idx];const t=team(PS.order[PS.turn]);const box=$('#mg');if(!box||!t)return;
  box.addEventListener('contextmenu',e=>e.preventDefault());
  const api=(MG[pr.g]||MG.toques)(box,pr,t,raw=>{
    const b=teamBonus(t,pr);
    PS.scores[t.id]={raw,bonus:b.pct,score:Math.round(raw*(1+b.pct/100))};
    PS.stage='teamScore';render();window.scrollTo(0,0);
  });
  countdown(box,()=>api.start());
}

  openSheet(`<form id="f-prueba" class="sheet-form" novalidate>

function syncChips(k){
  $$(`#sheet [data-act="shPick"][data-k="${k}"]`).forEach(b=>{const v=b.dataset.v;const on=k==='sk'?SH.sk.includes(v):SH[k]===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
}
function savePlayer(){
  const name=($('#fp-name').value||'').trim();const err=$('#f-err');
  if(!name){err.textContent='Escribe un nombre.';$('#fp-name').focus();return;}
  if(!SH.sk.length){err.textContent='Elige al menos un superpoder.';return;}
  const p={id:'c'+Date.now().toString(36),n:name,av:SH.av,sk:SH.sk.slice()};
  S.customPlayers.unshift(p);
  const d=S.draft;const at=S.ui.activeTeam;let msg=`Agregaste a ${name}.`;
  if(at){const r=d.roster[at]||(d.roster[at]=[]);if(r.length<d.size){r.push(p.id);if(!d.captain[at])d.captain[at]=p.id;msg=`${name} se sumó a ${teamDef(at).n}.`;}}
  save();closeSheet();updatePlayers();toast(msg);sfx.good();
}
function savePrueba(){
  const name=($('#fq-name').value||'').trim();const desc=($('#fq-desc').value||'').trim();const err=$('#f-err');
  if(!name){err.textContent='Escribe el nombre de la prueba.';$('#fq-name').focus();return;}
  if(!SH.sk.length){err.textContent='Elige al menos un superpoder.';return;}
  const p={id:'cp'+Date.now().toString(36),e:SH.e,n:name,d:desc||'Una prueba inventada por ti.',sk:SH.sk.slice(),g:SH.g,custom:true};
  S.customPruebas.push(p);if(S.draft.pruebas.length<12)S.draft.pruebas.push(p.id);
  save();closeSheet();updatePruebas();toast(`Agregaste la prueba ${name}.`);sfx.good();
}

/* ---------- acciones ---------- */
function go(){save();render();window.scrollTo(0,0);}
const A={
  home(){S.view='home';S.ui.confirmEnd=false;go();},
  sound(){S.sound=!S.sound;save();refreshSound();if(S.sound)sfx.good();},
  newKamp(){S.view='setup-teams';go();},
  quick(){quickGame();},
  continue(){const g=S.game;S.view=g.idx>=g.pruebas.length?'final':'hub';go();},
  nav(el){S.view=el.dataset.to;go();},
  setMode(el){const d=S.draft;const m=el.dataset.m;if(d.mode===m)return;d.mode=m;d.teamIds=(m==='paises'?TEAMS_P:TEAMS_A).slice(0,4).map(t=>t.id);d.roster={};d.captain={};save();render();},
  toggleTeam(el){
    const d=S.draft;const id=el.dataset.id;
    if(d.teamIds.includes(id)){d.teamIds=d.teamIds.filter(x=>x!==id);delete d.roster[id];delete d.captain[id];}
    else{if(d.teamIds.length>=8){toast('El máximo es 8 equipos.');return;}d.teamIds.push(id);sfx.tap();}
    save();render();
  },
  size(el){const d=S.draft;d.size=clamp(d.size+Number(el.dataset.d),1,8);d.teamIds.forEach(t=>{if(d.roster[t]&&d.roster[t].length>d.size){d.roster[t]=d.roster[t].slice(0,d.size);if(!d.roster[t].includes(d.captain[t]))d.captain[t]=d.roster[t][0]||null;}});save();render();},
  resetDraft(){S.draft=defaultDraft();save();render();toast('Configuración reiniciada.');},
  tab(el){S.ui.activeTeam=el.dataset.id;updatePlayers(true);},
  pick(el){
    const d=S.draft;const id=el.dataset.id;const at=S.ui.activeTeam;if(!at)return;const cur=teamOf(id);
    if(cur===at){removeFrom(at,id);sfx.tap();}
    else{
      const r=d.roster[at]||(d.roster[at]=[]);
      if(r.length>=d.size){toast(`${teamDef(at).n} ya tiene ${d.size}. Elige otro equipo arriba.`);sfx.bad();return;}
      if(cur)removeFrom(cur,id);
      r.push(id);if(!d.captain[at])d.captain[at]=id;sfx.tap();
      const p=person(id);
      if(r.length>=d.size){const nx=d.teamIds.find(t=>(d.roster[t]||[]).length<d.size);if(nx){S.ui.activeTeam=nx;toast(`¡${teamDef(at).n} está completo! Ahora elige para ${teamDef(nx).n}.`);}else toast('¡Todos los equipos están completos!');}
      else if(cur&&p)toast(`${p.n} se cambió a ${teamDef(at).n}.`);
    }
    save();updatePlayers(true);
  },
  captain(el){S.draft.captain[S.ui.activeTeam]=el.dataset.id;save();updatePlayers();sfx.tap();},
  remove(el){removeFrom(S.ui.activeTeam,el.dataset.id);save();updatePlayers();},
  autofill(){const n=autoFill(S.draft);save();updatePlayers();toast(n?'¡Equipos completados al azar!':'Los equipos ya están completos.');if(n)sfx.good();},
  clearAll(){const d=S.draft;d.roster={};d.captain={};save();updatePlayers();toast('Equipos vacíos.');},
  filter(el){S.ui.filter=el.dataset.f;updatePlayers();},
  addPlayer(){openPlayerSheet();},
  delPlayer(el){
    const id=el.dataset.id;const p=S.customPlayers.find(x=>x.id===id);
    S.customPlayers=S.customPlayers.filter(x=>x.id!==id);
    S.draft.teamIds.forEach(t=>removeFrom(t,id));
    save();updatePlayers();if(p)toast(`Borraste a ${p.n}.`);
  },
  togglePrueba(el){
    const d=S.draft;const id=el.dataset.id;
    if(d.pruebas.includes(id))d.pruebas=d.pruebas.filter(x=>x!==id);
    else{if(d.pruebas.length>=12){toast('El máximo es 12 pruebas.');return;}d.pruebas.push(id);sfx.tap();}
    save();updatePruebas();
  },
  randPruebas(){S.draft.pruebas=shuffle(allPruebas()).slice(0,5).map(p=>p.id);save();updatePruebas();sfx.good();},
  clearPruebas(){S.draft.pruebas=[];save();updatePruebas();},
  addPrueba(){openPruebaSheet();},
  delPrueba(el){const id=el.dataset.id;const p=S.customPruebas.find(x=>x.id===id);S.customPruebas=S.customPruebas.filter(x=>x.id!==id);S.draft.pruebas=S.draft.pruebas.filter(x=>x!==id);save();updatePruebas();if(p)toast(`Borraste la prueba ${p.n}.`);},
  start(){
    const d=S.draft;const empty=d.teamIds.filter(t=>!(d.roster[t]||[]).filter(pid=>person(pid)).length);
    if(d.teamIds.length<2){S.view='setup-teams';go();toast('Elige al menos 2 equipos.');return;}
    if(empty.length){S.ui.activeTeam=empty[0];S.view='setup-players';go();toast(`Faltan participantes en ${teamDef(empty[0]).n}.`);return;}
    if(d.pruebas.length<2){toast('Elige al menos 2 pruebas.');return;}
    startGame();sfx.win();
  },
  openPrueba(){PS={stage:'intro'};S.view='prueba';go();},
  toHub(){S.view='hub';S.ui.confirmEnd=false;go();},
  toFinal(){S.view='final';go();},
  askEnd(){S.ui.confirmEnd=true;render();},
  cancelEnd(){S.ui.confirmEnd=false;render();},
  confirmEnd(){S.ui.confirmEnd=false;S.game.endedEarly=true;S.view='final';go();},
  modeGame(){const g=S.game;PS={stage:'handoff',mode:'game',order:shuffle(g.teams.map(t=>t.id)),turn:0,scores:{}};render();window.scrollTo(0,0);},
  modeSim(){
    const g=S.game;const pr=g.pruebas[g.idx];const arr=simScores(g,pr);
    arr.slice().sort((a,b)=>b.score-a.score||Math.random()-.5).forEach((x,i)=>{x.rank=i;});
    PS={stage:'sim',mode:'sim',sim:arr,skip:false};render();window.scrollTo(0,0);
  },
  modeJudge(){PS={stage:'judge',mode:'judge',order:[]};render();},
  backIntro(){PS={stage:'intro'};render();},
  ready(){PS.stage='play';render();window.scrollTo(0,0);},
  nextTurn(){
    PS.turn++;
    if(PS.turn>=PS.order.length){
      const scored=PS.order.map(id=>Object.assign({teamId:id},PS.scores[id])).sort((a,b)=>b.score-a.score||b.raw-a.raw||Math.random()-.5);
      finishPrueba('game',scored);
    }else{PS.stage='handoff';render();window.scrollTo(0,0);}
  },
  simSkip(){if(PS)PS.skip=true;},
  simDone(){const scored=PS.sim.slice().sort((a,b)=>a.rank-b.rank).map(x=>({teamId:x.teamId,raw:x.score,bonus:0,score:x.score}));finishPrueba('sim',scored);},
  judgePick(el){
    const g=S.game;if(PS.order.includes(el.dataset.id))return;PS.order.push(el.dataset.id);sfx.tap();
    if(PS.order.length===g.teams.length-1){const rest=g.teams.find(t=>!PS.order.includes(t.id));if(rest)PS.order.push(rest.id);}
    render();
  },
  judgeUndo(){PS.order.pop();if(PS.order.length===S.game.teams.length-1)PS.order.pop();render();},
  judgeReset(){PS.order=[];render();},
  judgeOk(){finishPrueba('judge',PS.order.map(id=>({teamId:id})));},
  reveal(){
    const g=S.game;const st=standingsFull(g);const n=st.length;
    if(n-(g.revealed||0)>2){g.revealed=(g.revealed||0)+1;sfx.tick();save();render();return;}
    g.revealed=n;const c=st[0];
    if(!g.saved){
      g.awards=computeAwards(g,st);
      const star=g.awards.find(a=>a.k==='star');const sp=star&&person(star.pid);
      S.history.unshift({d:Date.now(),e:c.e,n:c.n,c:c.c,pts:c.pts,np:g.results.length,star:sp?sp.n:null});
      S.history=S.history.slice(0,30);g.saved=true;
    }
    go();sfx.win();confetti([c.c,c.c,c.c],180);
  },
  rematch(){const o=S.game;S.game=Object.assign({},o,{idx:0,results:[],revealed:0,saved:false,awards:null,endedEarly:false,started:Date.now()});PS=null;S.view='hub';go();toast('¡Revancha! Mismos equipos y mismas pruebas.');},
  sheetClose(){closeSheet();},
  shPick(el){
    const k=el.dataset.k,v=el.dataset.v;
    if(k==='sk'){if(SH.sk.includes(v))SH.sk=SH.sk.filter(x=>x!==v);else{SH.sk.push(v);if(SH.sk.length>2)SH.sk.shift();}}
    else SH[k]=v;
    syncChips(k);const err=$('#f-err');if(err)err.textContent='';
  }
};

  prueba(){if(!PS)return;if(PS.stage==='play')startPlay();else if(PS.stage==='sim')runSim();},

document.addEventListener('input',e=>{if(e.target.id==='q'){S.ui.search=e.target.value;const g=$('#pgrid');if(g)g.innerHTML=gridHTML();}});

function start(data){
  const src=(data&&data.S)||load()||defaults();
  S=normalize(JSON.parse(JSON.stringify(src)));
  S.ui={activeTeam:null,filter:'all',search:'',confirmEnd:false};
  if(S.view==='prueba')PS={stage:'intro'};
  render();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S:persistable()}));}catch(e){}

if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
